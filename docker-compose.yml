version: '3.8'

services:
  postgres-academia:
    image: postgres:16-alpine
    container_name: academia_certa
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: academia_certa
    ports:
      - "5434:5432"
    volumes:
      - pgdata_academia:/var/lib/postgresql/data

volumes:
  pgdata_academia: