version: '3.8'

services:
  postgres-academia:
    image: postgres:16-alpine
    container_name: pg-academia
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gestao_academia
    ports:
      - "5432:5432"
    volumes:
      - pgdata_academia:/var/lib/postgresql/data

volumes:
  pgdata_academia: